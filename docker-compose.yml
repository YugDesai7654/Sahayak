services:
  mongo:
    image: mongo:7
    container_name: sahayak-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand(\"ping\").ok' --quiet"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - sahayak-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sahayak-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongo:27017
      - MONGODB_DB_NAME=sahayak
      - FRONTEND_URL=http://localhost:3000
      - TESSERACT_CMD=/usr/bin/tesseract
      - AUTO_SEED=true
    volumes:
      - backend_keys:/app/keys
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - sahayak-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    container_name: sahayak-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sahayak-net

volumes:
  mongo_data:
  backend_keys:

networks:
  sahayak-net:
    driver: bridge
